name: Make Reel

on:
  workflow_dispatch:          # lets you press a "Run workflow" button to test
  repository_dispatch:        # lets Make trigger it automatically
    types: [make_reel]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Remember the background-remover model (saves time next run)
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: rembg-u2net-v1

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install -r requirements.txt

      - name: Build reel
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python make_reel.py

      - name: Save video (and cut-out previews) so you can download and check them
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reel
          path: |
            reel.mp4
            preview/
          if-no-files-found: ignore
